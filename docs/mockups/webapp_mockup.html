<style>
:root{
  --page:#eceff1; --panel:#fff; --ink:#16242b; --muted:#617079; --line:#e3e9ec;
  --accent:#0f6d7a; --accent-2:#12828f; --accent-soft:#e4f1f2;
  --topbar:#0e343c; --topbar-ink:#e9f4f5; --topbar-line:#1c4b54;
  --side:#f5f7f8; --side-ink:#3a4a52; --good:#1f8a54; --warn:#b5731a; --danger:#b23a48;
  --sh-D-bg:#fbe9cd;--sh-D-fg:#8a5300; --sh-E-bg:#d3edef;--sh-E-fg:#0a5b65;
  --sh-N-bg:#e2dcf6;--sh-N-fg:#3a2c86; --sh-M-bg:#d6eddd;--sh-M-fg:#1f6a41;
  --sh-O-bg:#e9edf0;--sh-O-fg:#7c8a95;
  --sh-HY-bg:#fadfe9;--sh-HY-fg:#9a2b54; --sh-X-bg:#efe8dc;--sh-X-fg:#6b5a3f;
  --sh-S-bg:#e6ebef;--sh-S-fg:#58636d;
  --we:rgba(15,109,122,.055);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0c1316; --panel:#141d21; --ink:#e6eef0; --muted:#8a99a0; --line:#243035;
  --accent:#3fb1c1; --accent-2:#54c6d6; --accent-soft:#12333a;
  --topbar:#0a2328; --topbar-ink:#dff1f3; --topbar-line:#17414a;
  --side:#101a1e; --side-ink:#a7b6bd;
  --sh-D-bg:#4a3a13;--sh-D-fg:#f6d79c; --sh-E-bg:#123f45;--sh-E-fg:#93dbe3;
  --sh-N-bg:#2c2559;--sh-N-fg:#c9bff4; --sh-M-bg:#173f2b;--sh-M-fg:#8fd9ab;
  --sh-O-bg:#1c262b;--sh-O-fg:#8595a0; --sh-HY-bg:#45222f;--sh-HY-fg:#f2a9c2;
  --sh-X-bg:#3a3122;--sh-X-fg:#d6c19a; --sh-S-bg:#212c31;--sh-S-fg:#9fb0b8;
  --we:rgba(63,177,193,.07);
}}
:root[data-theme="dark"]{
  --page:#0c1316; --panel:#141d21; --ink:#e6eef0; --muted:#8a99a0; --line:#243035;
  --accent:#3fb1c1; --accent-2:#54c6d6; --accent-soft:#12333a;
  --topbar:#0a2328; --topbar-ink:#dff1f3; --topbar-line:#17414a;
  --side:#101a1e; --side-ink:#a7b6bd;
  --sh-D-bg:#4a3a13;--sh-D-fg:#f6d79c; --sh-E-bg:#123f45;--sh-E-fg:#93dbe3;
  --sh-N-bg:#2c2559;--sh-N-fg:#c9bff4; --sh-M-bg:#173f2b;--sh-M-fg:#8fd9ab;
  --sh-O-bg:#1c262b;--sh-O-fg:#8595a0; --sh-HY-bg:#45222f;--sh-HY-fg:#f2a9c2;
  --sh-X-bg:#3a3122;--sh-X-fg:#d6c19a; --sh-S-bg:#212c31;--sh-S-fg:#9fb0b8;
  --we:rgba(63,177,193,.07);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}

/* Top bar */
.top{background:var(--topbar);color:var(--topbar-ink);display:flex;align-items:center;
  gap:16px;padding:0 18px;height:56px;border-bottom:1px solid var(--topbar-line);
  position:sticky;top:0;z-index:50;}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:15px;letter-spacing:-.01em;}
.brand .dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent-2),var(--accent));font-size:13px;}
.top .sp{flex:1;}
.pill{background:rgba(255,255,255,.09);border:1px solid var(--topbar-line);color:var(--topbar-ink);
  border-radius:8px;padding:6px 11px;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;}
.pill select{background:transparent;border:0;color:inherit;font:inherit;outline:none;}
.pill select option{color:#111;}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;}
.iconbtn{background:rgba(255,255,255,.08);border:1px solid var(--topbar-line);color:inherit;
  width:32px;height:32px;border-radius:8px;font-size:14px;display:grid;place-items:center;}

/* Shell */
.shell{display:flex;min-height:calc(100vh - 56px);}
.side{width:210px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;gap:3px;}
.nav{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--side-ink);
  font-size:13.5px;font-weight:550;border:1px solid transparent;}
.nav .ic{width:17px;text-align:center;opacity:.85;}
.nav:hover{background:var(--panel);}
.nav.active{background:var(--panel);color:var(--accent);border-color:var(--line);font-weight:700;}
.nav.hide{display:none;}
.side .lbl{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:14px 11px 5px;}

.main{flex:1;min-width:0;padding:18px 22px 40px;}
.crumb{font-size:12px;color:var(--muted);margin-bottom:3px;}
.h1{font-size:20px;font-weight:750;letter-spacing:-.01em;margin:0 0 2px;}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 12px;}
.mnav{display:inline-flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:3px;}
.mnav button{background:transparent;border:0;color:var(--ink);padding:5px 8px;border-radius:6px;font-size:13px;}
.mnav .cur{font-weight:700;padding:5px 10px;min-width:96px;text-align:center;}
.mnav button:hover{background:var(--accent-soft);}
.btn{background:var(--accent);color:#fff;border:0;padding:8px 15px;border-radius:9px;
  font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{background:var(--accent-2);}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.sp{flex:1;}
.legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted);}
.lg{display:inline-flex;align-items:center;gap:5px;}
.chip{width:20px;height:17px;border-radius:4px;display:grid;place-items:center;font-size:10.5px;font-weight:800;}
.chip.sh-D{background:var(--sh-D-bg);color:var(--sh-D-fg);}
.chip.sh-E{background:var(--sh-E-bg);color:var(--sh-E-fg);}
.chip.sh-N{background:var(--sh-N-bg);color:var(--sh-N-fg);}
.chip.sh-M{background:var(--sh-M-bg);color:var(--sh-M-fg);}
.chip.sh-O{background:var(--sh-O-bg);color:var(--sh-O-fg);}
.chip.sh-HY{background:var(--sh-HY-bg);color:var(--sh-HY-fg);}

/* stat cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;}
.card .k{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.card .v{font-size:23px;font-weight:750;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.card .s{font-size:11px;color:var(--muted);margin-top:2px;}
.dotc{width:8px;height:8px;border-radius:50%;}

/* grid */
.gridwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.gscroll{overflow-x:auto;}
table.duty{border-collapse:separate;border-spacing:0;font-size:12px;white-space:nowrap;}
.duty th,.duty td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  padding:0;height:30px;text-align:center;font-variant-numeric:tabular-nums;}
.duty thead th{position:sticky;top:0;background:var(--panel);z-index:3;font-weight:650;color:var(--muted);
  height:24px;font-size:11px;}
.duty thead tr.wd th{height:20px;font-size:10.5px;font-weight:600;}
.duty .nmcol{position:sticky;left:0;z-index:4;background:var(--panel);text-align:left;
  padding:0 10px;min-width:118px;font-weight:600;border-right:2px solid var(--line);}
.duty thead .nmcol{z-index:6;}
.duty td.nmcol{color:var(--ink);}
.duty td.day{width:30px;min-width:30px;}
.duty .we{background:var(--we);}
.duty td.we,.duty th.we{background-image:linear-gradient(var(--we),var(--we));}
.cell{width:100%;height:100%;display:grid;place-items:center;font-weight:800;font-size:11px;}
.sh-D .cell{background:var(--sh-D-bg);color:var(--sh-D-fg);}
.sh-E .cell{background:var(--sh-E-bg);color:var(--sh-E-fg);}
.sh-N .cell{background:var(--sh-N-bg);color:var(--sh-N-fg);}
.sh-M .cell{background:var(--sh-M-bg);color:var(--sh-M-fg);}
.sh-O .cell{background:var(--sh-O-bg);color:var(--sh-O-fg);font-weight:600;}
.sh-HY .cell{background:var(--sh-HY-bg);color:var(--sh-HY-fg);font-size:10px;}
.sh-X .cell{background:var(--sh-X-bg);color:var(--sh-X-fg);font-size:9px;}
.sh-S .cell{background:var(--sh-S-bg);color:var(--sh-S-fg);}
.sh-C .cell{background:var(--sh-M-bg);color:var(--sh-M-fg);font-size:9px;position:relative;}
.sh-C .cell::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--good);}
.duty tr.grp td{position:sticky;left:0;background:var(--accent-soft);color:var(--accent);
  text-align:left;padding:3px 10px;font-size:11px;font-weight:750;letter-spacing:.02em;
  border-right:0;z-index:2;}
.duty .tot{background:var(--panel);color:var(--muted);font-weight:700;width:26px;min-width:26px;font-size:11px;}
.duty thead .tot{color:var(--muted);}
.duty td.tot.tD{color:var(--sh-D-fg);}
.duty td.tot.tN{color:var(--sh-N-fg);}
.duty tfoot td{position:sticky;bottom:0;background:var(--panel);font-weight:700;color:var(--muted);
  border-top:2px solid var(--line);height:24px;font-size:11px;}
.duty tfoot td.nmcol{color:var(--ink);z-index:4;}
.mgrrow td.nmcol{color:var(--muted);}
.mgrrow .cell{opacity:.75;}

.note{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;gap:8px;align-items:center;}

/* generic panels for other tabs */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start;}
@media(max-width:860px){.grid2{grid-template-columns:1fr;}}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;}
.field input,.field textarea,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--page);color:var(--ink);font:inherit;font-size:13px;}
.req{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:9px;background:var(--page);}
.req .who{font-weight:650;font-size:13px;}
.req .meta{font-size:11.5px;color:var(--muted);}
.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;}
.badge.wait{background:var(--sh-D-bg);color:var(--sh-D-fg);}
.badge.ok{background:var(--sh-M-bg);color:var(--sh-M-fg);}
.mini-actions{margin-left:auto;display:flex;gap:6px;}
.bar{height:9px;border-radius:6px;background:var(--accent-soft);overflow:hidden;}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.statrow{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;font-size:12.5px;margin-bottom:8px;}
.statrow .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;}
.hide{display:none!important;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--panel);padding:11px 18px;border-radius:10px;font-size:13px;
  font-weight:600;opacity:0;transition:.3s;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,.2);}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.mocknote{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;font-size:11.5px;color:var(--accent);margin-bottom:14px;display:flex;gap:8px;align-items:center;}

/* 원티드 신청 — 근무종류 칩 */
.shchips{display:flex;gap:8px;flex-wrap:wrap;}
.shchip{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;
  padding:7px 12px 7px 8px;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:600;}
.shchip:hover{border-color:var(--accent);}
.shchip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.warn-note{background:var(--sh-D-bg);color:var(--sh-D-fg);border-radius:9px;
  padding:10px 12px;font-size:12px;margin:12px 0 16px;line-height:1.45;}
.sel-label{margin-top:12px;font-size:13.5px;font-weight:700;color:var(--accent);
  display:flex;align-items:center;gap:7px;}
/* 캘린더 */
.cal{margin-top:4px;}
.cal .cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal .cwd{text-align:center;font-size:11px;font-weight:700;padding:2px 0 4px;}
.cal .cday{aspect-ratio:1/1;min-height:42px;border:1px solid var(--line);border-radius:9px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;
  font-size:14px;font-variant-numeric:tabular-nums;background:var(--panel);
  cursor:pointer;user-select:none;transition:.08s;}
.cal .cday.blank{border:0;background:transparent;cursor:default;}
.cal .cday:not(.blank):hover{border-color:var(--accent);}
.cal .cday.sun{color:var(--danger);}
.cal .cday.sat{color:var(--accent);}
.cal .cday.selstart,.cal .cday.selend{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:800;}
.cal .cday.inrange{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);}
.cal.view .cday{cursor:default;}
.cal .cday.has{border-color:transparent;font-weight:800;}
.cal .cday.has.sh-D{background:var(--sh-D-bg);color:var(--sh-D-fg);}
.cal .cday.has.sh-E{background:var(--sh-E-bg);color:var(--sh-E-fg);}
.cal .cday.has.sh-N{background:var(--sh-N-bg);color:var(--sh-N-fg);}
.cal .cday.has.sh-O{background:var(--sh-O-bg);color:var(--sh-O-fg);}
.cal .cday .mk{font-size:9px;font-weight:800;letter-spacing:.02em;}
@media(max-width:560px){.cal .cday{min-height:38px;font-size:13px;border-radius:8px;}}

/* ===== 기기/모바일 ===== */
.stage{display:block;}
.bottomnav{display:none;}
.stage.bezel{max-width:406px;margin:18px auto;height:824px;border:9px solid #0b1015;
  border-radius:32px;overflow:hidden;display:flex;flex-direction:column;background:var(--page);
  box-shadow:0 24px 70px rgba(0,0,0,.4);}
.stage.bezel .shell{flex:1;min-height:0;overflow-y:auto;}
.stage.bezel .top{position:sticky;}
/* 모바일 레이아웃(프리뷰·실기기 공통) */
.stage.mlayout .side{display:none;}
.stage.mlayout .shell{display:block;}
.stage.mlayout .main{padding:14px 13px 74px;}
.stage.mlayout .top{height:52px;padding:0 12px;gap:10px;}
.stage.mlayout .bsub,.stage.mlayout .wardpill{display:none;}
.stage.mlayout .cards{grid-template-columns:1fr 1fr;gap:9px;}
.stage.mlayout .grid2{grid-template-columns:1fr;}
.stage.mlayout .bottomnav{display:flex;}
.stage.mlayout.bezel .bottomnav{flex-shrink:0;}
.stage.mlayout:not(.bezel) .bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:40;}
.bottomnav{height:60px;border-top:1px solid var(--line);background:var(--panel);}
.bottomnav .bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;font-size:10px;color:var(--muted);cursor:pointer;font-weight:600;}
.bottomnav .bn.on{color:var(--accent);}
.bottomnav .bn .bi{font-size:18px;}

/* 모바일 근무표 — 주간뷰 */
.mtoggle{display:flex;gap:7px;margin:4px 0 12px;}
.mtoggle button{flex:1;padding:10px;border:1.5px solid var(--line);background:var(--panel);
  border-radius:11px;font-weight:700;font-size:13.5px;color:var(--ink);}
.mtoggle button.on{background:var(--accent);color:#fff;border-color:var(--accent);}
.wknav{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:12px;font-weight:700;font-size:13.5px;}
.wknav button{background:transparent;border:0;font-size:19px;color:var(--accent);padding:2px 12px;line-height:1;}
.mydays{display:flex;flex-direction:column;gap:8px;}
.myday{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:13px;padding:12px 14px;}
.myday.off{opacity:.68;}
.myday .dl{display:flex;flex-direction:column;align-items:center;min-width:32px;}
.myday .dw{font-size:11px;font-weight:800;}
.myday .dn{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1;}
.myday .dt{flex:1;font-size:12px;color:var(--muted);padding-left:6px;}
.myday .dchip{min-width:48px;height:42px;border-radius:11px;display:grid;place-items:center;
  font-size:15px;font-weight:800;}
.myday .dchip.sh-D{background:var(--sh-D-bg);color:var(--sh-D-fg);}
.myday .dchip.sh-E{background:var(--sh-E-bg);color:var(--sh-E-fg);}
.myday .dchip.sh-N{background:var(--sh-N-bg);color:var(--sh-N-fg);}
.myday .dchip.sh-M{background:var(--sh-M-bg);color:var(--sh-M-fg);}
.myday .dchip.sh-C{background:var(--sh-M-bg);color:var(--sh-M-fg);font-size:12px;}
.myday .dchip.sh-O{background:var(--sh-O-bg);color:var(--sh-O-fg);}
.myday .dchip.sh-HY{background:var(--sh-HY-bg);color:var(--sh-HY-fg);font-size:11px;}
.duty.mini th,.duty.mini td{height:36px;}
.duty.mini .nmcol{min-width:64px;font-size:11.5px;padding:0 7px;}
.duty.mini .day{width:38px;min-width:38px;}
.meRow td{background:var(--accent-soft);}
.meRow td.nmcol{color:var(--accent);font-weight:800;}

/* 상세 명단 */
.rtable{width:100%;border-collapse:collapse;font-size:12.5px;}
.rtable th,.rtable td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap;}
.rtable th{color:var(--muted);font-weight:700;font-size:11.5px;}
.rtable td.c{text-align:center;}
.cbadge{font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;}
.cbadge.up{background:var(--sh-M-bg);color:var(--sh-M-fg);}
.cbadge.mid{background:var(--sh-D-bg);color:var(--sh-D-fg);}
.cbadge.low{background:var(--sh-HY-bg);color:var(--sh-HY-fg);}
.lock{background:var(--sh-HY-bg);color:var(--sh-HY-fg);border-radius:9px;padding:9px 13px;
  font-size:12px;margin-bottom:14px;display:flex;gap:8px;align-items:center;}
.winbar{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid var(--line);
  border-radius:10px;padding:9px 13px;font-size:12.5px;margin-bottom:14px;}
.winbar .st{font-weight:700;color:var(--accent);}
.winbar button{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:7px;
  padding:4px 9px;font-size:11.5px;color:var(--muted);cursor:pointer;}

/* ===== 통계 차트 (검증된 팔레트) ===== */
:root{--c-D:#e08a00;--c-E:#0e8fa0;--c-N:#6152d8;--c-M:#1e9e5e;--c-O:#9aa7ad;--c-H:#d96a8f;}
:root[data-theme="dark"]{--c-D:#f0b24d;--c-E:#3fc2d4;--c-N:#9d8cff;--c-M:#43c97f;--c-O:#6b7a82;--c-H:#ef9db8;}

function calMeta(){const wd=wdIdx[DATA[curMonth].first];return{lead:(wd+1)%7,nd:31};}
function wdHead(){return WKO.map((w,i)=>`<div class="cwd" style="color:${i===0?'var(--danger)':i===6?'var(--accent)':'var(--muted)'}">${w}</div>`).join('');}
function pickerCal(){
  const {lead,nd}=calMeta();let c=wdHead();
  for(let i=0;i<lead;i++)c+='<div class="cday blank"></div>';
  for(let d=1;d<=nd;d++){const dow=(lead+d-1)%7;let cls='cday';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';
    if(pickStart&&pickEnd){if(d===pickStart||d===pickEnd)cls+=' selstart';else if(d>pickStart&&d<pickEnd)cls+=' inrange';}
    else if(pickStart&&d===pickStart)cls+=' selstart';
    c+=`<div class="${cls}" onclick="pickDay(${d})">${d}</div>`;}
  return `<div class="cal"><div class="cgrid">${c}</div></div>`;
}
function viewCal(){
  const {lead,nd}=calMeta();const mk={};MYREQ.forEach(r=>mk[r.d]=r.s);let c=wdHead();
  for(let i=0;i<lead;i++)c+='<div class="cday blank"></div>';
  for(let d=1;d<=nd;d++){const dow=(lead+d-1)%7;let cls='cday';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';const s=mk[d];
    const info=s?CLASS(s):['',''];
    c+=`<div class="${cls}${s?' has '+info[0]:''}">${d}${s?`<span class="mk">${info[1]}</span>`:''}</div>`;}
  return `<div class="cal view"><div class="cgrid">${c}</div></div>`;
}
function pickDay(d){
  if(pickStart===null||pickEnd!==null){pickStart=d;pickEnd=null;}
  else if(d<pickStart){pickEnd=pickStart;pickStart=d;}
  else if(d>pickStart){pickEnd=d;}
  render();
}
function setShift(s){selShift=s;render();}
function selLabel(){
  const mm=curMonth.slice(5);
  if(pickStart===null)return '날짜를 선택하세요 (하루 또는 시작~종료)';
  if(pickEnd===null)return `${mm}월 ${pickStart}일 (1일)`;
  return `${mm}월 ${pickStart}일 ~ ${pickEnd}일 · 총 ${pickEnd-pickStart+1}일`;
}

function weeksOf(){const {lead,nd}=calMeta();let w=[],c=[];
  for(let d=1;d<=nd;d++){const dow=(lead+d-1)%7;if(dow===0&&c.length){w.push(c);c=[];}c.push(d);}
  if(c.length)w.push(c);return w;}
function moveWeek(d){const w=weeksOf();curWeek=Math.min(w.length-1,Math.max(0,curWeek+d));render();}

const fmt=v=>Number.isInteger(v)?v:v.toFixed(1);
function statCounts(n,month){
  const first=wdIdx[DATA[month].first];
  const c={D:0,E:0,N:0,M:0,OFF:0,HY:0,work:0,weOff:0,days:0};
  n.s.forEach((x,i)=>{if(x==='.')return;c.days++;const dow=(first+i)%7;
    if(x==='D'||x==='M/D')c.D++;else if(x==='E'||x==='M/E')c.E++;else if(x==='N')c.N++;
    else if(x==='M')c.M++;else if(x==='OFF'){c.OFF++;if(dow>=5)c.weOff++;}else if(x==='HY')c.HY++;});
  c.work=c.D+c.E+c.N+c.M;return c;}
function monthAgg(month){
  const staff=DATA[month].roster.filter(n=>!n.mgr);
  const per=staff.map(n=>({name:n.name,team:n.t,...statCounts(n,month)}));
  const k=per.length,nd=31,avg=f=>per.reduce((a,b)=>a+b[f],0)/k,tot=f=>per.reduce((a,b)=>a+b[f],0);
  const N=per.map(p=>p.N);
  return {per,k,avgWork:avg('work'),avgN:avg('N'),avgOff:avg('OFF'),avgWeOff:avg('weOff'),
    nMin:Math.min(...N),nMax:Math.max(...N),nSpread:Math.max(...N)-Math.min(...N),
    daily:{D:tot('D')/nd,E:tot('E')/nd,N:tot('N')/nd,M:tot('M')/nd}};}
function prevMonth(){const i=months.indexOf(curMonth);return i>0?months[i-1]:null;}
function kpi(label,val,unit,d,goodDown){
  let dh;
  if(d===null)dh=`<span class="delta" style="color:var(--muted)">· 전월 데이터 없음</span>`;
  else{const ar=d>0?'▲':d<0?'▼':'–';const good=goodDown?(d<0):null;
    const col=d===0?'var(--muted)':good===null?'var(--muted)':good?'var(--good)':'var(--danger)';
    dh=`<span class="delta" style="color:${col}">${ar} ${fmt(Math.abs(d))} <span style="color:var(--muted);font-weight:500">전월대비</span></span>`;}
  return `<div class="card"><div class="k">${label}</div><div class="v">${fmt(val)}<span class="u">${unit}</span></div>${dh}</div>`;}
function compBar(p,big){
  const t=p.days||(p.work+p.OFF+p.HY)||31;
  const seg=(k,cls)=>p[k]>0?`<span class="seg ${cls}" style="width:${p[k]/t*100}%" title="${k} ${p[k]}일">${p[k]>=3?p[k]:''}</span>`:'';
  return `<div class="crow${big?' big':''}">${big?'':`<span class="cname">${p.name}</span>`}<span class="cbar">${seg('D','c-D')}${seg('E','c-E')}${seg('N','c-N')}${seg('M','c-M')}${seg('OFF','c-O')}${seg('HY','c-H')}</span></div>`;}
function compLegend(){return `<div class="chlegend">${[['c-D','데이'],['c-E','이브닝'],['c-N','나이트'],['c-M','미드'],['c-O','오프'],['c-H','연차']].map(([c,l])=>`<span class="lg"><span class="sw" style="background:var(--${c.replace('c-','c-')})"></span>${l}</span>`).join('')}</div>`;}
function groupCompare(pairs){
  const max=Math.max(...pairs.flatMap(p=>[p.cur,p.prev||0]))*1.25||1;
  return `<div class="grp-cmp">${pairs.map(p=>`<div class="g"><div class="bars">
     ${p.prev!=null?`<div class="bar prev" style="height:${p.prev/max*100}%"><span class="bv">${fmt(p.prev)}</span></div>`:''}
     <div class="bar cur" style="height:${p.cur/max*100}%"><span class="bv">${fmt(p.cur)}</span></div>
   </div><div class="glab">${p.lab}</div></div>`).join('')}</div>
   <div class="chlegend"><span class="lg"><span class="sw" style="background:var(--line)"></span>전월</span><span class="lg"><span class="sw" style="background:var(--accent)"></span>이번 달</span></div>`;}

function renderStatAdmin(){
  const a=monthAgg(curMonth),pm=prevMonth(),p=pm?monthAgg(pm):null;
  const dl=k=>p?(a[k]-p[k]):null;
  const kpis=`<div class="cards">
    ${kpi('평균 근무일',a.avgWork,'일',dl('avgWork'),false)}
    ${kpi('평균 나이트',a.avgN,'개',dl('avgN'),false)}
    ${kpi('평균 오프',a.avgOff,'개',dl('avgOff'),false)}
    ${kpi('나이트 편차',a.nSpread,'개',dl('nSpread'),true)}</div>`;
  // 근무 구성 (팀 순서 그대로)
  const comp=a.per.map(x=>compBar(x)).join('');
  // 교대별 일평균
  const gc=groupCompare(['D','E','N','M'].map(s=>({lab:s,cur:a.daily[s],prev:p?p.daily[s]:null})));
  // 나이트 분포 (컴팩트 히스토그램)
  const dist={};a.per.forEach(x=>{dist[x.N]=(dist[x.N]||0)+1;});
  const nkeys=[];for(let v=a.nMin;v<=a.nMax;v++)nkeys.push(v);
  const maxc=Math.max(...nkeys.map(v=>dist[v]||0))||1,avgR=Math.round(a.avgN);
  const hist=`<div class="nhist">${nkeys.map(v=>{const cnt=dist[v]||0;
    return `<div class="nh"><div class="nhw"><span class="nhc">${cnt||''}</span><div class="nhb${v===avgR?' avg':''}" style="height:${cnt/maxc*100}%"></div></div><span class="nhx">${v}</span></div>`;}).join('')}</div>
    <div class="chlegend"><span>가로=나이트 수 / 세로=인원 · 보라=평균(${fmt(a.avgN)}) 부근</span></div>`;
  return `<div class="crumb">61병동 · 부서장 통계</div>
    <div class="h1">근무 통계 <span style="font-size:13px;font-weight:500;color:var(--muted)">전월 대비</span></div>
    ${monthNav()}

      ${kpis}
      <div class="chartcard"><h3>간호사별 근무 구성</h3><p class="sub">한 달 D·E·N·미드·오프 비율 (막대에 일수)</p>${comp}${compLegend()}</div>
      <div class="chartcard"><h3>교대별 일평균 인원 · 전월 대비</h3><p class="sub">하루 평균 배치 인원</p>${gc}</div>
      <div class="chartcard"><h3>나이트 배분 공정성</h3><p class="sub">인원별 나이트 수 분포</p>
        <div class="avgline">평균 ${fmt(a.avgN)}개 · 최소 ${a.nMin} ~ 최대 ${a.nMax} · 편차 ${a.nSpread} (목표 ≤3)</div>${hist}</div>
    </div>`;
}

  document.querySelectorAll('[data-role]').forEach(el=>{
    el.classList.toggle('hide', !el.dataset.role.split(' ').includes(curRole));
  });
  document.getElementById('avatar').textContent=curRole==='master'?'M':curRole==='admin'?'파':'원';
  // if active tab hidden, go to duty
  const act=document.querySelector('.nav.active');
  if(act&&act.classList.contains('hide')){setActive('duty');}
  render();
}
function setActive(tab){
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
  render();
}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{if(n.dataset.tab)setActive(n.dataset.tab);});
document.getElementById('roleSel').onchange=e=>{curRole=e.target.value;applyRole();};
document.getElementById('wardSel').onchange=()=>toast('병동을 전환했습니다 (시안)');
document.getElementById('themeBtn').onclick=()=>{
  const r=document.documentElement,cur=r.getAttribute('data-theme');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');
};
function moveMonth(d){const i=months.indexOf(curMonth);const ni=Math.min(months.length-1,Math.max(0,i+d));curMonth=months[ni];render();}
let tt;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),2200);}
function genToast(){toast('⏳ 근무표를 생성하는 중...');setTimeout(()=>toast('✅ 근무표 생성 완료 · 대원칙 위반 0건'),900);}
document.getElementById('deviceBtn').onclick=()=>{previewMobile=true;mobileMode=!mobileMode;if(!mobileMode)previewMobile=false;applyDevice();};
window.addEventListener('resize',()=>{if(!previewMobile){const m=window.innerWidth<=640;if(m!==mobileMode){mobileMode=m;applyDevice();}}});
if(window.innerWidth<=640)mobileMode=true;
applyRole();
applyDevice();
</script>
